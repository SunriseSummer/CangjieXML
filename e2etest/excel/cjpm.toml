[package]
  cjc-version = "1.0.5"
  name = "xlsx_to_csv"
  version = "0.1.0"
  output-type = "executable"
  description = "用 CangjieXML 解析 xlsx（OOXML）并把每个 sheet 导出为 CSV，验证 XML 库的能力"
  src-dir = "src"
  target-dir = "target"

[dependencies]
  cangjie_xml = { path = "../.." }

[test-dependencies]

# ------------------------------------------------------------------------------
#   Linux   x86_64  : https://github.com/SunriseSummer/CangjieSDK/releases/download/1.0.5/cangjie-stdx-linux-x64-1.0.5.1.zip
#   Linux   aarch64 : cangjie-stdx-linux-aarch64-*.zip（同发行页）
#   Windows x86_64  : cangjie-stdx-windows-x64-*.zip（同发行页）
#
# 解压后得到 `stdx/dynamic/stdx/` 目录直接放到本项目根下即可。
# ------------------------------------------------------------------------------

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["./stdx/dynamic/stdx"]

[target.aarch64-unknown-linux-gnu]
  [target.aarch64-unknown-linux-gnu.bin-dependencies]
    path-option = ["./stdx/dynamic/stdx"]

[target.x86_64-w64-mingw32]
  [target.x86_64-w64-mingw32.bin-dependencies]
    path-option = ["./stdx/dynamic/stdx"]
